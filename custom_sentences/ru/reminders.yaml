    data:
      - sentences:
          - "(измени|отредактируй|исправь|поправь) [моё|мое] напоминание [о|про] {reminder_text}"
          - "(измени|отредактируй|исправь) напоминание {reminder_text}"
        slots:
          edit_ask: "yes"
      - sentences:
          - "(перенеси|передвинь|переставь) напоминание [о|про] {reminder_text} на {hour} {ampm}"
          - "(перенеси|передвинь|переставь) напоминание [о|про] {reminder_text} на {hour} часов"
          - "(перенеси|передвинь|переставь) напоминание [о|про] {reminder_text} на {hour}:{minute}"
      - sentences:
          - "(убери|отмени|останови) повторение напоминания [о|про] {reminder_text}"
          - "пусть напоминание [о|про] {reminder_text} больше не повторяется"
        slots:
          stop_repeating: "yes"
  CustomReminderAgain:
    data:
      - sentences:
          - "(напомни|напоминай) [мне] (еще|ещё) раз через {rel_num} {rel_unit}"
          - "(повтори|повторить) [последнее] напоминание через {rel_num} {rel_unit}"
          - "(напомни|напоминай) [мне] снова через {rel_num} {rel_unit}"
  CustomReminderFallback:
    data:
      - sentences:
          - "<fgr_start> {fallback_rest}"
          - "<fgr_start>"
expansion_rules:
  fgr_start: "(напомни|напомните|пожалуйста напомни) [мне] [пожалуйста]"
  fgr_repeat: "(напоминай|напоминайте|напомни|напомните) [мне] [пожалуйста]"
lists:
  reminder_text:
    wildcard: true
  fallback_rest:
    wildcard: true
  rel_num:
    range:
      from: 1
      to: 365
  hour:
    range:
      from: 0
      to: 23
  minute:
    range:
      from: 0
      to: 59
  rel_unit:
    values:
      - in: "(секунду|секунды|секунд|сек)"
        out: "seconds"
      - in: "(минуту|минуты|минут|мин)"
        out: "minutes"
      - in: "(час|часа|часов)"
        out: "hours"
      - in: "(день|дня|дней|сутки|суток)"
        out: "days"
  ampm:
    values:
      - in: "(утра|утром|а м)"
        out: "am"
      - in: "(вечера|вечером|дня|днём|днем|ночи|ночью|п м)"
        out: "pm"
  weekday:
    values:
      - in: "(понедельник|понедельникам|понедельника)"
        out: 0
      - in: "(вторник|вторникам|вторника)"
        out: 1
      - in: "(среду|среда|средам|среды)"
        out: 2
      - in: "(четверг|четвергам|четверга)"
        out: 3
      - in: "(пятницу|пятница|пятницам|пятницы)"
        out: 4
      - in: "(субботу|суббота|субботам|субботы)"
        out: 5
      - in: "(воскресенье|воскресеньям|воскресенья)"
        out: 6
  monthday:
    values:
      - in: "(1|первого)"
        out: 1
      - in: "(2|второго)"
        out: 2
      - in: "(3|третьего)"
        out: 3
      - in: "(4|четвертого)"
        out: 4
      - in: "(5|пятого)"
        out: 5
      - in: "(6|шестого)"
        out: 6
      - in: "(7|седьмого)"
        out: 7
      - in: "(8|восьмого)"
        out: 8
      - in: "(9|девятого)"
        out: 9
      - in: "(10|десятого)"
        out: 10
      - in: "(11|одиннадцатого)"
        out: 11
      - in: "(12|двенадцатого)"
        out: 12
      - in: "(13|тринадцатого)"
        out: 13
      - in: "(14|четырнадцатого)"
        out: 14
      - in: "(15|пятнадцатого)"
        out: 15
      - in: "(16|шестнадцатого)"
        out: 16
      - in: "(17|семнадцатого)"
        out: 17
      - in: "(18|восемнадцатого)"
        out: 18
      - in: "(19|девятнадцатого)"
        out: 19
      - in: "(20|двадцатого)"
        out: 20
      - in: "(21|двадцать первого)"
        out: 21
      - in: "(22|двадцать второго)"
        out: 22
      - in: "(23|двадцать третьего)"
        out: 23
      - in: "(24|двадцать четвертого)"
        out: 24
      - in: "(25|двадцать пятого)"
        out: 25
      - in: "(26|двадцать шестого)"
        out: 26
      - in: "(27|двадцать седьмого)"
        out: 27
      - in: "(28|двадцать восьмого)"
        out: 28
      - in: "(29|двадцать девятого)"
        out: 29
      - in: "(30|тридцатого)"
        out: 30
      - in: "(31|тридцать первого)"
        out: 31
