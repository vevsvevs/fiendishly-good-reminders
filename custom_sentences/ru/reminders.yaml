# Russian Assist grammar for FGR. Copied to /config/custom_sentences/ru/reminders.yaml
# Language-specific speech shapes only: no scheduler, calendar or English-code changes.
# Broad fixed patterns deliberately avoid catching timer/light commands.
language: ru
