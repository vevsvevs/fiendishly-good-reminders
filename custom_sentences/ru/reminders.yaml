expansion_rules:
  fgr_read: "(расскажи|скажи|назови|перечисли|озвучь|прочитай|зачитай|покажи)"
  fgr_tell: "(скажи|скажите|расскажи|расскажите) [мне]"
  fgr_status: "[ну] [<fgr_tell>] (что [там]|как [там] дела|как обстоят дела)"
  fgr_status_reminders: "(с ([моими] напоминаниями|[моим] напоминанием)|по ([моим] напоминаниям|[моему] напоминанию))"
  fgr_status_about: "[<fgr_tell>] (как насч(ё|е)т|что по поводу) ([моих] напоминаний|[моего] напоминания)"
  fgr_status_personal: "([у меня] <fgr_status_reminders>|<fgr_status_reminders> у меня)"
  fgr_status_next: "((с [моим] (ближайшим|следующим|очередным)|со следующим) напоминанием|по [моему] (ближайшему|следующему|очередному) напоминанию)"
  fgr_status_topic: "(с ([моим|этим] напоминанием|[моими|этими] напоминаниями)|по ([моему|этому] напоминанию|[моим|этим] напоминаниям)) (о|об|про)"
  fgr_tell_one: "<fgr_tell> (про [моё|мое] напоминание|о [моём|моем] напоминании)"
  fgr_tell_reminders: "(<fgr_tell_one>|<fgr_tell> (про [мои] [все] напоминания|о [моих|всех|запланированных] напоминаниях|об активных напоминаниях|обо всех [моих] напоминаниях)) [(у|для) меня] [пожалуйста]"
  fgr_tell_next: "<fgr_tell> (про [моё|мое] <fgr_next> напоминание|о [моём|моем] (следующем|ближайшем|очередном) напоминании)"
  fgr_count_question: "[скажи [мне]] сколько [всего] (у меня напоминаний|напоминаний [у меня])"
  fgr_next: "(следующее|ближайшее|очередное)"
  fgr_period_question: "((какие|что за|есть ли) [у меня] напоминания|(какие|что за|есть ли) напоминания у меня|какие напоминания [у меня] запланированы|<fgr_read> [мне] [мои] [все] напоминания|<fgr_tell_reminders>)"
  fgr_find: "((когда|во сколько) [будет|стоит|сработает]|есть ли|найди|<fgr_read> [мне])"
  fgr_compound_delay: "(через|спустя) ({rel_num} {rel_unit}|{fgr_single_relative_unit:rel_unit}) [и] ({rel_num:rel_num2} {rel_unit:rel_unit2}|{fgr_single_relative_unit:rel_unit2}) [[и] ({rel_num:rel_num3} {rel_unit:rel_unit3}|{fgr_single_relative_unit:rel_unit3})]"
  fgr_start: "(напомни|напомните|пожалуйста напомни) [мне] [пожалуйста]"
  fgr_repeat: "(напоминай|напоминайте|напомни|напомните) [мне] [пожалуйста]"
lists:
  fgr_period_prep:
    values:
      - in: "сегодняшних"
        out: "today"
      - in: "завтрашних"
        out: "tomorrow"
  fgr_period_acc:
    values:
      - in: "сегодняшние"
        out: "today"
      - in: "завтрашние"
        out: "tomorrow"
  fgr_query_period:
    values:
      - in: "[на] сегодня"
        out: "today"
      - in: "[на] завтра"
        out: "tomorrow"
      - in: "[на] послезавтра"
        out: "day_after_tomorrow"
      - in: "(в|на) выходные"
        out: "weekend"
      - in: "на (этой неделе|эту неделю|текущей неделе|текущую неделю)"
        out: "week"
      - in: "на следующ(ей неделе|ую неделю)"
        out: "nextweek"
      - in: "(в этом месяце|на этот месяц)"
        out: "month"
      - in: "(в следующем месяце|на следующий месяц)"
        out: "nextmonth"
  reminder_text:
    wildcard: true
  person:
    wildcard: true
  fallback_rest:
    wildcard: true
  rel_num:
    range:
      from: 1
      to: 365
  hour:
    range:
      from: 0
      to: 23
  minute:
    range:
      from: 0
      to: 59
  fgr_single_relative_unit:
    values:
      - in: "секунду"
        out: "seconds"
      - in: "минуту"
        out: "minutes"
      - in: "час"
        out: "hours"
      - in: "(день|сутки)"
        out: "days"
  rel_unit:
    values:
      - in: "(секунду|секунды|секунд|сек)"
        out: "seconds"
      - in: "(минуту|минуты|минут|мин)"
        out: "minutes"
      - in: "(час|часа|часов)"
        out: "hours"
      - in: "(день|дня|дней|сутки|суток)"
        out: "days"
  ampm:
    values:
      - in: "(утра|утром|а м)"
        out: "am"
      - in: "(вечера|вечером|дня|днём|днем|ночи|ночью|п м)"
        out: "pm"
  weekday:
    values:
      - in: "(понедельник|понедельникам|понедельника)"
        out: 0
      - in: "(вторник|вторникам|вторника)"
        out: 1
      - in: "(среду|среда|средам|среды)"
        out: 2
      - in: "(четверг|четвергам|четверга)"
        out: 3
      - in: "(пятницу|пятница|пятницам|пятницы)"
        out: 4
      - in: "(субботу|суббота|субботам|субботы)"
        out: 5
      - in: "(воскресенье|воскресеньям|воскресенья)"
        out: 6
  monthday:
    values:
      - in: "(1|первого)"
        out: 1
      - in: "(2|второго)"
        out: 2
      - in: "(3|третьего)"
        out: 3
      - in: "(4|четвертого)"
        out: 4
      - in: "(5|пятого)"
        out: 5
      - in: "(6|шестого)"
        out: 6
      - in: "(7|седьмого)"
        out: 7
      - in: "(8|восьмого)"
        out: 8
      - in: "(9|девятого)"
        out: 9
      - in: "(10|десятого)"
